<body>

  <main>
    <div class="page-heading">
      <h1>Color Picker</h1>
      <p>Pick a color and see its hex code</p>
    </div>
    <div class="form-card" style="max-width:360px;">
      <label for="color-input">Pick a color</label>
      <input type="color" id="color-input" value="#8b5cf6" style="width:100%;height:60px;padding:0.2rem;cursor:pointer;">
      <div id="color-preview" style="margin-top:1rem;height:100px;border-radius:10px;background:#8b5cf6;"></div>
      <p id="color-hex" style="margin-top:0.75rem;font-size:1.2rem;font-weight:600;text-align:center;">#8b5cf6</p>
    </div>
  </main>
  <script>
    var input = document.getElementById('color-input');
    var preview = document.getElementById('color-preview');
    var hex = document.getElementById('color-hex');
    input.addEventListener('input', function() {
      preview.style.background = input.value;
      hex.textContent = input.value;
    });
  </script>
</body>
</html>
