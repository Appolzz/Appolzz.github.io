<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appolzz Login</title>
</head>
<body>
  <main style="max-width:380px;margin:3rem auto;font-family:Arial,sans-serif;">
    <h1>Login to Appolzz</h1>
    <form id="loginForm" method="POST">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required style="width:100%;padding:.75rem;margin:.5rem 0;border:1px solid #bbb;border-radius:8px;">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required style="width:100%;padding:.75rem;margin:.5rem 0;border:1px solid #bbb;border-radius:8px;">
      <button type="submit" style="width:100%;padding:.75rem;margin-top:1rem;background:#1d4ed8;color:#fff;border:none;border-radius:8px;cursor:pointer;">Log in</button>
    </form>
    <p id="error-message" style="color:red;margin-top:1rem;"></p>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
      event.preventDefault();
      var user = document.getElementById('username').value;
      var pass = document.getElementById('password').value;
      var errorMsg = document.getElementById('error-message');
      if (user === 'user123' && pass === 'cheesecake') {
        window.location.href = './all/home.html';
      } else {
        errorMsg.textContent = 'Wrong username or password. Please try again.';
      }
    });
  </script>
</body>
</html>
